name: CI
on:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup R 
        uses: r-lib/actions/setup-r@v2
        # assuming here that this setup includes installation of quantreg library
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches installed packages for faster subsequent runs
      - name: Install scikit-learn, python library
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      # - uses: julia-actions/cache@v2
      #   env:
      #     cache-name: cache-artifacts
      #   with:
      #     path: ~/.julia/artifacts
      #     key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
      #     restore-keys: |
      #       ${{ runner.os }}-test-${{ env.cache-name }}-
      #       ${{ runner.os }}-test-
      #       ${{ runner.os }}-
      - name: Build Julia package deps
        uses: julia-actions/julia-buildpkg@v1
      - name: Debug R
        run: |
          which R || true
          R --version || true
          echo "R_HOME=$R_HOME"
          find ~/.julia -name libR
      - name: Build RCall and PyCall (test deps)
        # we explicitly build in case cached versions point to wrong R/python installations
        run: |
          echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV
          echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> $GITHUB_ENV
          julia --project=. -e '
              r_home = get(ENV, "R_HOME", "<unset>")
              @info "Building RCall with ENV[\"R_HOME\"]=$r_home ..."
              using Pkg
              Pkg.add(
                  [Pkg.PackageSpec(name="RCall"), Pkg.PackageSpec(name="PyCall")],
                  preserve=Pkg.PRESERVE_ALL,
              )
              Pkg.build("RCall")
              Pkg.build("PyCall")'
      - uses: julia-actions/julia-runtest@v1
        env:
          DO_COMPARISONS: "true"
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v1
        with:
          file: lcov.info
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
